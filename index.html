<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ff-Hack</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: url('https://images.unsplash.com/photo-1542751371-adc38448a05e') no-repeat center/cover;
    overflow: hidden;
}

/* overlay */
.overlay {
    background: rgba(0,0,0,0.85);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* กล่อง */
.box {
    background: rgba(10,10,10,0.95);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 30px red;
    width: 320px;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 10px red; }
    to { box-shadow: 0 0 40px crimson; }
}

h1 {
    text-align: center;
    color: red;
    text-shadow: 0 0 15px red;
    margin-bottom: 20px;
}

/* options */
.option {
    margin: 15px 0;
    font-size: 18px;
    display: flex;
    align-items: center;
    transition: 0.2s;
}

.option:hover {
    color: red;
    transform: translateX(5px);
}

/* checkbox */
input[type="checkbox"] {
    appearance: none;
    width: 20px;
    height: 20px;
    border: 2px solid red;
    border-radius: 5px;
    margin-right: 10px;
    cursor: pointer;
}

input[type="checkbox"]:checked {
    background: red;
    box-shadow: 0 0 15px red;
}

/* button */
button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(45deg, red, darkred);
    border: none;
    color: white;
    font-size: 18px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 15px;
    transition: 0.3s;
}

button:hover {
    box-shadow: 0 0 20px red;
    transform: scale(1.05);
}

/* เอฟเฟกต์ scan line */
.scan {
    position: absolute;
    width: 100%;
    height: 2px;
    background: red;
    animation: scan 2s linear infinite;
}

@keyframes scan {
    0% { top: 0; }
    100% { top: 100%; }
}
</style>
</head>

<body>

<div class="overlay">
    <div class="box">
        <h1>ff-Hack</h1>

        <div class="option">
            <input type="checkbox" id="opt1" onclick="playClick()"> ยิงหัว
        </div>
        <div class="option">
            <input type="checkbox" id="opt2" onclick="playClick()"> วิ่งไว
        </div>
        <div class="option">
            <input type="checkbox" id="opt3" onclick="playClick()"> ออโต้ปั้มยา
        </div>
        <div class="option">
            <input type="checkbox" id="opt4" onclick="playClick()"> ออโต้กดวิ่ง
        </div>
        <div class="option">
            <input type="checkbox" id="opt5" onclick="playClick()"> ออโต้ยืนนิ่ง
        </div>

        <button onclick="saveData()">บันทึก</button>
    </div>
</div>

<div class="scan"></div>

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<script>
// โหลดค่า
window.onload = function() {
    for (let i = 1; i <= 5; i++) {
        let val = localStorage.getItem("opt" + i);
        if (val === "true") {
            document.getElementById("opt" + i).checked = true;
        }
    }
}

// เสียงกด
function playClick() {
    document.getElementById("clickSound").play();
}

// บันทึก
function saveData() {
    for (let i = 1; i <= 5; i++) {
        let checked = document.getElementById("opt" + i).checked;
        localStorage.setItem("opt" + i, checked);
    }
    alert("บันทึกเรียบร้อย!");
<br><br>
<a href="profile.html" style="color: #ff0000; text-decoration: none; font-weight: bold; border: 1px solid #ff0000; padding: 5px 10px; border-radius: 5px;">
    [ ดูโปรไฟล์ผู้สร้าง ]
</a>
    
}
</script>

</body>
</html>
